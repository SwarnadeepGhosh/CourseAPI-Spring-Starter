# Connecting to Postgres Database
#spring.datasource.url=jdbc:postgresql://host:port/database
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USER}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

############### Actuator ###############
management.port=8080
management.endpoints.web.exposure.include=*


############### Logging ###############
logging.file.name=logs/application.log
logging.level.root=INFO
# Log Level for springframework (info, error, debug etc)
#logging.level.org.springframework = error
# Log Level for Specific Controller
#logging.level.com.swarna.todoFullStack.todo = error

############### Swagger - openapi ###############
#Open API path = http://localhost:8080/api-docs
#Open API file = http://localhost:8080/api-docs.yaml
springdoc.api-docs.path=/api-docs

# Swagger path: http://localhost:8080/docs.html or http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.path=/docs.html
